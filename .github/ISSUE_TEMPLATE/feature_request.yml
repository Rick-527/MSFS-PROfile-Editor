name: Feature Request
description: Suggest an improvement or new feature for MSFS PROfile Editor
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to MSFS PROfile Editor.

        Please describe the idea and how it would improve the program.

  - type: textarea
    id: feature
    attributes:
      label: Feature or Improvement
      description: What would you like to see added or changed?
      placeholder: Describe your idea.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why Would This Be Useful?
      description: Explain the problem this would solve or how it would improve your workflow.
      placeholder: Tell us why this feature would be useful.
    validations:
      required: true

  - type: textarea
    id: current-workaround
    attributes:
      label: Current Workaround
      description: If you currently work around this limitation another way, describe it here.
      placeholder: Optional

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add any screenshots, examples, or other information that may help explain the idea.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have checked existing Issues to see if this has already been suggested.
          required: true